[build]
  publish = "."
  command = "echo 'No build command - static site'"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# No SPA redirect needed for static site - keep direct file serving
