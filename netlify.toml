[build]
  publish = "."
  command = "echo 'No build command - static site'"
  functions = "netlify/functions"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    Content-Security-Policy-Report-Only = "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; img-src 'self' data: https:; font-src 'self' https://fonts.gstatic.com data:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://assets.calendly.com; script-src 'self' https://assets.calendly.com https://browser.sentry-cdn.com 'sha256-3X25ycw1qFhPPjk4frkeb7dDLxAgTmSz4795BqwkXQs=' 'sha256-Ao+YerZ4CsFuFtfbd0iQo6yQjYG0quKuKm0ZXnGtRn8=' 'sha256-qc9tUc6rnXKrxNreQJrEsRO3VeY3u3CVPlH9t4qg8NA=' 'sha256-5tj1IpTqbSEFBAP8lVR2sBWZK8zHF1HV79glEHZdq20=' 'sha256-3IVxEX1Pmh8rzBPKITIM/WdrnjxTS40p7MUl1nZfRfU=' 'sha256-g8l37tRw0J6HoVtY5bDPdFrby/AOwE0nAKbyedSWsE0=' 'sha256-Qvc4RTJagv09oTbrbChu7earfByWwcA/CWV3Ha0zVn4=' 'sha256-FjSnPeHeizaRprDQtCrEgw5S2G7nxoxdJGVUNj4tG/w=' 'sha256-dAGe+twLiBk/JWIj0jsYsvbJGTZ0AVOZC7RHivLPQso=' 'sha256-TMsrtwot3GzsraUaEvCAcCvZsesoc9SI/ZR/ux31AkU=' 'sha256-DpHjO4QdIKNb3AFY5lHBdG+wEAWitvJpxsmRczL8e10=' 'sha256-ulsQy1rR5lZJ26WcRH9IMvd+ZTp3w+juKlPndZnzkyM=' 'sha256-Gas3oWSpft+ZIBGPfGJqelsL/Yo/Ss6xeZ/MMEJYYsI='; frame-src https://calendly.com https://*.calendly.com; connect-src 'self' https://calendly.com https://*.calendly.com https://assets.calendly.com https://*.ingest.sentry.io https://sentry.io"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Dynamic sitemap
[[redirects]]
  from = "/sitemap.xml"
  to = "/.netlify/functions/sitemap"
  status = 200

# No SPA redirect needed for static site - keep direct file serving
