[build]
  publish = "."
  command = "echo 'No build command - static site'"
  functions = "netlify/functions"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    Content-Security-Policy = "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; img-src 'self' data: https:; font-src 'self' https://fonts.gstatic.com data:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://assets.calendly.com; script-src 'self' https://assets.calendly.com https://browser.sentry-cdn.com https://unpkg.com 'sha256-lJ2Qtp+IrhdzGtKhBnpGBR66WIa/HqWi21N9F9jMAzs=' 'sha256-+AlQEXZWzfaAv+on0In6PSB6NEdXFCll+W5cr/SEtsM=' 'sha256-9USH+Q6PyNyaLHOyFFttlvDVgKoM8nG5MF94fbBb+ZQ=' 'sha256-5tj1IpTqbSEFBAP8lVR2sBWZK8zHF1HV79glEHZdq20=' 'sha256-SpnhIOtbJO1Y5uv4ILpQhCVPPXy0CMhK3uxiRlQI34w=' 'sha256-g8l37tRw0J6HoVtY5bDPdFrby/AOwE0nAKbyedSWsE0=' 'sha256-IkqvGvhE04RyqQb6AyK12LG2CdpDmrF7pm6sOmblYtk=' 'sha256-FjSnPeHeizaRprDQtCrEgw5S2G7nxoxdJGVUNj4tG/w=' 'sha256-aVtq/ULbR2faYlICO+VqzqTryqk6d5+Y8JHOrzp0ARw=' 'sha256-TMsrtwot3GzsraUaEvCAcCvZsesoc9SI/ZR/ux31AkU=' 'sha256-0A+bSZRxxap5bda9Ut2V6CZ0CySNDEcNSQpT6Ca/CMs=' 'sha256-ulsQy1rR5lZJ26WcRH9IMvd+ZTp3w+juKlPndZnzkyM=' 'sha256-KxK2I6H0iGaPbuO1GVHm4v0lrhuFJnhAvwuRLW2kj/c=' 'sha256-in5T8jHk8ZcwhkWyQ64m2oILPtzi7576EX2UuZl2S38=' 'sha256-Gas3oWSpft+ZIBGPfGJqelsL/Yo/Ss6xeZ/MMEJYYsI=' 'sha256-fthv6otiARG+EK1AwxtjFcgHwnxEGGi1aHMNKGgwZ8Q='; frame-src https://calendly.com https://*.calendly.com https://identity.netlify.com; connect-src 'self' https://calendly.com https://*.calendly.com https://assets.calendly.com https://*.ingest.sentry.io https://sentry.io https://api.github.com https://identity.netlify.com https://*.netlify.com"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Dynamic sitemap
[[redirects]]
  from = "/sitemap.xml"
  to = "/.netlify/functions/sitemap"
  status = 200

# No SPA redirect needed for static site - keep direct file serving
