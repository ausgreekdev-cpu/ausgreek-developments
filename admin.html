<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="light dark" />
  <title>Admin — Ausgreek Developments</title>
  <meta name="robots" content="noindex,nofollow" />
  <link rel="stylesheet" href="css/style.css" />
  <style>.admin{max-width:900px;margin:48px auto;padding:0 24px} table{width:100%;border-collapse:collapse;font-size:13px} th,td{padding:8px;border-bottom:1px solid var(--slate-200);text-align:left} .token-box{margin-bottom:16px}</style>
</head>
<body>
  <a href="#main" class="skip-link">Skip to content</a>
  <header class="navbar"><div class="container nav-container"><a href="/" class="logo"><span class="logo-mark">AD</span><span class="logo-text">Ausgreek<span>Developments</span></span></a></div></header>
  <div class="admin" id="main">
    <h1>Admin — Submissions</h1>
    <div class="token-box">
      <input id="adminToken" type="password" placeholder="Admin token" style="padding:8px 12px;border:1.5px solid var(--slate-200);border-radius:8px" />
      <button class="btn btn-primary" id="loadBtn">Load</button>
    </div>
    <div id="status"></div>
    <h2 style="margin-top:24px">Analytics (last 100 events)</h2>
    <div id="analyticsStatus" style="font-size:13px;color:var(--slate-600);margin-bottom:8px"></div>
    <table id="analyticsTable"><thead><tr><th>Event</th><th>Page</th><th>IP</th><th>Time</th></tr></thead><tbody></tbody></table>
    <h2 style="margin-top:24px">Quote submissions</h2>
    <table id="table"><thead><tr><th>ID</th><th>Name</th><th>Email</th><th>Type</th><th>Estimate</th><th>Created</th></tr></thead><tbody></tbody></table>
  </div>
  <script>
    async function loadAll(token) {
      const status = document.getElementById('status');
      const aStatus = document.getElementById('analyticsStatus');
      status.textContent = 'Loading...';
      try {
        const [subRes, anaRes] = await Promise.all([
          fetch('/.netlify/functions/submissions', { headers: { 'X-Admin-Token': token } }),
          fetch('/.netlify/functions/analytics', { headers: { 'X-Admin-Token': token } })
        ]);
        const subData = await subRes.json();
        const anaData = await anaRes.json();
        if (!subRes.ok) throw new Error(subData.error || 'Submissions failed');
        const tbody = document.querySelector('#table tbody');
        tbody.innerHTML = '';
        (subData.quotes || []).forEach(q => {
          const tr = document.createElement('tr');
          tr.innerHTML = '<td>'+q.id+'</td><td>'+ (q.name||'') +'</td><td>'+ (q.email||'') +'</td><td>'+ (q.type||'') +'</td><td>'+ (q.estimate||'') +'</td><td>'+ (q.created_at||'') +'</td>';
          tbody.appendChild(tr);
        });
        status.textContent = 'Loaded ' + (subData.quotes||[]).length + ' quotes.';
        const aTbody = document.querySelector('#analyticsTable tbody');
        aTbody.innerHTML = '';
        (anaData.events || []).forEach(e => {
          const tr = document.createElement('tr');
          tr.innerHTML = '<td>'+ (e.event||'') +'</td><td>'+ (e.page||'') +'</td><td>'+ (e.ip||'') +'</td><td>'+ (e.ts||'') +'</td>';
          aTbody.appendChild(tr);
        });
        if (aStatus) aStatus.textContent = 'Loaded ' + (anaData.events||[]).length + ' events.';
      } catch (e) { status.textContent = 'Error: ' + e.message; }
    }
    document.getElementById('loadBtn').addEventListener('click', () => {
      loadAll(document.getElementById('adminToken').value);
    });
  </script>
</body>
</html>
