<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="light dark" />
  <title>Content Manager — Ausgreek Developments</title>
  <meta name="robots" content="noindex,nofollow" />
  <meta property="og:title" content="Content Manager — Ausgreek Developments" />
  <meta property="og:description" content="Decap CMS admin for Ausgreek Developments content." />
  <meta property="og:type" content="website" />
  <link rel="icon" href="../assets/icon.svg" type="image/svg+xml" />
</head>
<body>
  <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
  <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
  <script>
    if (window.netlifyIdentity) {
      window.netlifyIdentity.on('init', user => {
        if (!user) window.netlifyIdentity.open();
      });
      window.netlifyIdentity.on('login', () => { document.location.href = '/admin/'; });
    }
  </script>
</body>
</html>
